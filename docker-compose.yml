name: fishing-shop

services:
  postgres:
    image: postgres:16
    container_name: fishing-shop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_dev_password}
    ports:
      - "127.0.0.1:5432:5432"   # localhost only, the dev password is weak
    # Docker's default 64 MB /dev/shm is too small for parallel queries: concurrent reports failed with
    # "could not resize shared memory segment" (docs/perf/load-test.md)
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33
    container_name: fishing-shop-mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP for the dev profile; nothing leaves this container
      - "127.0.0.1:8025:8025"   # web UI with every caught email

volumes:
  pgdata:
