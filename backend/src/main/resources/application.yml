spring:
  application:
    name: fishing-shop

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns:
      - "*:future"
      - "repeatable:missing"

  jackson:
    deserialization:
      accept-float-as-int: false
    factory:
      constraints:
        read:
          max-document-length: 32768

  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
