spring:
  application:
    name: fishing-shop

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop_dev_password}

  jpa:
    open-in-view: false          # avoids lazy loading leaking into controllers
    hibernate:
      ddl-auto: validate         # only Flyway migrations change the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
