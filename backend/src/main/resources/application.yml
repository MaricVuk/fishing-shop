spring:
  application:
    name: fishing-shop

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns:
      - "*:future"
      - "repeatable:missing"

  jackson:
    deserialization:
      accept-float-as-int: false
    factory:
      constraints:
        read:
          max-document-length: 32768

  mvc:
    problemdetails:
      enabled: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 30000
      mail.smtp.writetimeout: 10000

  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 45s

  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: 8080
  forward-headers-strategy: native

shop:
  auth:
    secure-cookies: true
    session-max-age: 8h
    max-failures-per-pair: 5
    max-failures-per-email: 100
    max-failures-per-address: 50
    failure-window: 15m
  orders:
    max-per-address: 20
    rate-window: 10m
  mail:
    from: ${SHOP_MAIL_FROM}
  jobs:
    worker-enabled: true
    poll-interval: 5s
    batch-size: 10
    max-attempts: 14
    base-backoff: 30s
    max-backoff: 6h
  bootstrap:
    owner-email: ${SHOP_OWNER_EMAIL:}
    owner-password: ${SHOP_OWNER_PASSWORD:}
    owner-name: ${SHOP_OWNER_NAME:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
