spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop_dev_password}

  flyway:
    locations: classpath:db/migration,classpath:db/dev

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

shop:
  auth:
    secure-cookies: false
  mail:
    from: ${SHOP_MAIL_FROM:Ribolovački shop <prodaja@fishing-shop.test>}
  invoice:
    seller-name: ${SHOP_SELLER_NAME:Ribolovački shop d.o.o. (demo)}
    seller-address: ${SHOP_SELLER_ADDRESS:Obala reke 1, 11000 Beograd}
    tax-id: ${SHOP_SELLER_TAX_ID:100000000}
    registration-number: ${SHOP_SELLER_REGISTRATION_NUMBER:20000000}
    bank-account: ${SHOP_SELLER_BANK_ACCOUNT:000-0000000000000-00}

logging:
  structured:
    format:
      console: ""
