name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the Docker that is already on the GitHub runner
      - name: Build and test
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose --env-file demo.env -f compose.prod.yml -f compose.demo.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the images and start the demo stack
        run: $COMPOSE up --build -d --wait --wait-timeout 420

      - name: Smoke test through the frontend
        run: scripts/smoke.sh http://127.0.0.1:3100

      - name: Backend runs without the dev profile
        run: $COMPOSE logs backend | grep -q "No active profile set"

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color
